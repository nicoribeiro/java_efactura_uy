# Control de acceso por empresa (usuarios que no son ADMIN solo acceden a las empresas asignadas
# con PUT /api/v1/users/:uid/empresas/:rut).
#   off     = sin control
#   log     = registra en el log quien seria bloqueado ("SERIA BLOQUEADO"), sin bloquear
#   enforce = bloquea con 403
# Desplegar en log, asignar las empresas a los usuarios hasta que no aparezcan avisos, y recien ahi pasar a enforce.
seguridad.accesoEmpresa="log"

# Vencimiento de los tokens de sesion (AUTH-TOKEN / api_key; las credenciales HMAC no vencen).
#   off     = no vencen
#   log     = registra en el log "SESION SERIA RECHAZADA", sin rechazar
#   enforce = rechaza con 401 (hay que volver a hacer login)
# Integraciones que usan un token de sesion fijo (ej: scripts de cron) deben pasar a credenciales HMAC antes de enforce.
seguridad.sesion.expiracion="log"
seguridad.sesion.inactividadMinutos=480
seguridad.sesion.duracionMaximaHoras=168

# Controles de DGI sobre los CFE recibidos (ver ControlesRecepcion). Un valor por control:
#   E02 = el mismo CFE (emisor, tipo, serie y numero) ya se habia recibido y aceptado
#   E03 = el numero del CFE esta en el rango del CAE
#   E04 = la firma electronica del CFE es valida (y el certificado estaba vigente al firmar)
#   E05 = el CFE cumple el formato del XSD de DGI (RecepcionCFE.formato.xsd)
#   E07 = la fecha de firma del CFE no es posterior al vencimiento del CAE
#   E12 = los documentos que el CFE referencia estan en los recibidos de ese emisor (el e-Resguardo puede referenciar los emitidos a el)
#   off     = no se controla
#   log     = si no pasa se registra en el CFE (observacionesRecepcion, se ve en el panel) y en el log, y se acepta igual
#   enforce = si no pasa se rechaza el CFE con ese motivo: el ACK (ME_...) que se le envia al emisor lo informa
# Desplegar en log, revisar las observaciones un tiempo y recien ahi pasar a enforce.
RecepcionCFE.control.E02="log"
RecepcionCFE.control.E03="log"
RecepcionCFE.control.E04="log"
RecepcionCFE.control.E05="log"
RecepcionCFE.control.E07="log"
RecepcionCFE.control.E12="log"
# XSD con el que E05 valida cada CFE recibido (el CFE con su adenda: CFE_Adenda), relativo al directorio de la app.
# Si falta se usa este; si no se puede cargar se loguea y no se controla el formato (nunca se rechaza por eso).
RecepcionCFE.formato.xsd="resources/xsd/XSDs_FE_1_44_2/original/CFEEmpresas.xsd"
