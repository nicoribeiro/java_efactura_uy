# Reporte diario a DGI desde la API (reemplaza el cron con curl): una vez por dia despues de "hora", genera los
# reportes faltantes (no aceptados) de cantReportes dias desde hoy - diasDesde. Con 30 y 20 cubre de hace 30 a hace
# 11 dias (los ultimos 10 dias se reportan con atraso a proposito). empresas: RUTs separados por coma; vacio = todas
# las empresas con firma digital. Activar en una sola instancia.
ReporteDiarioPoller.run = false
ReporteDiarioPoller.hora = 15
ReporteDiarioPoller.intervaloMinutos = 5   # cada cuanto revisa si ya es la hora
ReporteDiarioPoller.diasDesde = 30
ReporteDiarioPoller.cantReportes = 20
ReporteDiarioPoller.empresas = ""

